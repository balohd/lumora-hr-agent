name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      EMBEDDING_PROVIDER: lsa        # fully offline + deterministic index in CI
      HR_TODAY: "2026-10-30"
      LLM_PROVIDER: none             # tests never call a paid/external LLM
      SEED: "42"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements*.txt

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Import / build check
        run: python -c "import app.main, agent.orchestrator, mcp_server.server, rag.retriever; print('imports OK')"

      - name: Build RAG index
        run: python -m rag.ingest

      - name: MCP tool discovery + tool call smoke test
        run: python scripts/mcp_smoke.py

      - name: App start-up smoke test (uvicorn + /health)
        run: |
          uvicorn app.main:app --port 8000 &
          APP_PID=$!
          for i in $(seq 1 30); do curl -fsS localhost:8000/health && break; sleep 2; done
          curl -fsS localhost:8000/health | python -c "import json,sys; b=json.load(sys.stdin); assert b['mcp']['connected'], b; print('health OK')"
          kill $APP_PID

      - name: Unit, integration and end-to-end tests
        run: pytest -q

      - name: Evaluation (offline, quick)
        run: python -m evaluation.run_eval --quick --out evaluation/results/ci

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: eval-results
          path: evaluation/results/ci

  deploy:
    needs: test                       # deployment only happens if every test step passed
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Trigger Render deploy hook
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK_URL" ]; then
            echo "::error::RENDER_DEPLOY_HOOK_URL secret is not set"; exit 1
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK_URL"

      - name: Wait for the new deploy to become healthy
        env:
          DEPLOY_URL: ${{ vars.DEPLOY_URL }}
        if: env.DEPLOY_URL != ''
        run: |
          sleep 60
          for i in $(seq 1 40); do
            if curl -fsS "$DEPLOY_URL/health"; then echo; echo "deployed and healthy"; exit 0; fi
            sleep 15
          done
          echo "::error::deployment did not become healthy"; exit 1
